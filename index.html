<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Scam Shield: spot the scam before the money moves. Message, link and QR checks, payment reconciliation, code and login scans, simulated factory alerts. English and Hindi.">
<title>Scam Shield</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: sticky header + scrolling tab strip, one card stack per tab, built for a thumb on a 390px screen.
   Palette: pine-green accent on a green-grey neutral; severity colours are separate from the accent. */
:root{
  --bg:#F1F5F3;--surface:#FFFFFF;--ink:#12201D;--mut:#55665F;--line:#D9E2DD;--accent:#0B6B5D;--accent-ink:#FFFFFF;
  --hi:#B42318;--hib:#FDE7E4;--me:#9A4405;--meb:#FDEFD2;--lo:#0A6B3F;--lob:#DCF4E5;--un:#475467;--unb:#E8ECEA;
  --code:#0F1A17;--code-ink:#DCEBE5;
  --f-body:"Inter","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Space Grotesk","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1412;--surface:#141F1C;--ink:#E7F1ED;--mut:#9BAEA7;--line:#26352F;--accent:#43C4AC;--accent-ink:#052019;
  --hi:#FF9187;--hib:#3A1815;--me:#F4B862;--meb:#3A2B11;--lo:#74DCA5;--lob:#12301F;--un:#AAB7C0;--unb:#222C30;
  --code:#091210;--code-ink:#CFE3DB;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1412;--surface:#141F1C;--ink:#E7F1ED;--mut:#9BAEA7;--line:#26352F;--accent:#43C4AC;--accent-ink:#052019;
  --hi:#FF9187;--hib:#3A1815;--me:#F4B862;--meb:#3A2B11;--lo:#74DCA5;--lob:#12301F;--un:#AAB7C0;--unb:#222C30;
  --code:#091210;--code-ink:#CFE3DB;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:700 20px/1.1 var(--f-head);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;min-width:0}
.brand svg{flex:none}
.brand small{display:block;font:500 11px/1.3 var(--f-body);color:var(--mut);letter-spacing:.02em}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:transparent;color:var(--mut);font:600 14px var(--f-body);padding:8px 13px;border-radius:10px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
main{padding-top:16px;display:grid;gap:14px}
.panel[hidden]{display:none}
.panel{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font:700 17px/1.25 var(--f-head);margin:0 0 6px;text-wrap:balance}
.card h3{font:600 12px/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 0 6px}
.muted{color:var(--mut)}.small{font-size:12.5px}
p{margin:6px 0}
label.fld{display:block;font-weight:500;margin:10px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:96px}
textarea.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
input[type=file]{width:100%;font:inherit;padding:8px 0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:600 14px var(--f-body);cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--hi);border-color:var(--hi)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font:600 12px/1.6 var(--f-body);white-space:nowrap}
.p-high{background:var(--hib);color:var(--hi)}.p-medium{background:var(--meb);color:var(--me)}
.p-low{background:var(--lob);color:var(--lo)}.p-unk{background:var(--unb);color:var(--un)}
.result{border-left:5px solid var(--un);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:12px}
.result.high{border-color:var(--hi)}.result.medium{border-color:var(--me)}.result.low{border-color:var(--lo)}
.result ul{margin:6px 0 6px 18px;padding:0}.result li{margin:3px 0}
.rid{font-size:11px;color:var(--mut);margin-left:6px}
.stat{display:flex;gap:22px;margin-top:12px}.stat b{display:block;font:700 28px/1 var(--f-head)}.stat span{font-size:12px;color:var(--mut)}
.list{display:grid;gap:8px;margin-top:10px}
.item{border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:9px 12px;background:var(--surface);min-width:0;overflow-wrap:anywhere}
.item.high{border-left-color:var(--hi)}.item.medium{border-left-color:var(--me)}.item.low{border-left-color:var(--lo)}.item.ack{opacity:.55}
.item .meta{font-size:12px;color:var(--mut)}
.comp{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.comp:last-child{border:0}.comp div{min-width:0}.comp .d{font-size:12.5px;color:var(--mut)}
.banner{background:var(--meb);color:var(--me);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;margin-bottom:10px}
.note{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mut);margin-top:12px}
pre.diff{background:var(--code);color:var(--code-ink);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:12px;margin:8px 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.chk input{margin-top:4px;width:18px;height:18px;flex:none}
svg.chart{width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin:10px 0}
.foot{margin-top:6px;font-size:12px;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:40;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>
</head>
<body>

<div class="wrap">
<header class="top">
  <div class="bar">
    <div class="brand">
      <svg width="26" height="28" viewBox="0 0 26 28" aria-hidden="true"><path d="M13 1.5 2.5 5.4v8.1c0 6.4 4.4 11.1 10.5 13 6.1-1.900 10.500-6.600 10.500-13V5.400L13 1.500Z" fill="var(--accent)"/><path d="m8.300 14 3.300 3.300 6.200-6.600" fill="none" stroke="var(--accent-ink)" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Scam Shield<small data-en="Detect · Explain · Recommend · Record" data-hi="पहचानें · समझाएँ · सुझाएँ · दर्ज करें"></small></span>
    </div>
    <div class="tools">
      <button class="chip" id="voiceBtn" aria-pressed="false" data-en="Voice" data-hi="आवाज़"></button>
      <button class="chip" id="langBtn" aria-label="Switch language">हिंदी</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<main>
<!-- OVERVIEW -->
<section class="panel" id="p-overview">
  <div class="card">
    <h2 data-en="Readiness" data-hi="तैयारी"></h2>
    <div id="overall"></div>
    <div id="components"></div>
    <p class="small muted" data-en="Built only from checks you have run. A check that has not run shows Not assessed. It is not a claim that the business is secure." data-hi="केवल उन जाँचों से बनता है जो आपने चलाई हैं। जो जाँच नहीं चली उसे 'आकलन नहीं' दिखता है। यह सुरक्षित होने का दावा नहीं है।"></p>
  </div>
  <div class="card">
    <h2 data-en="Try it in one tap" data-hi="एक टैप में आज़माएँ"></h2>
    <p class="muted" data-en="Demo data is made up: sample QR text, fake keys, invented sales and a simulated machine. Nothing leaves your phone." data-hi="डेमो डेटा बनावटी है: नमूना QR टेक्स्ट, नकली कुंजियाँ, बनावटी बिक्री और सिम्युलेटेड मशीन। कुछ भी आपके फ़ोन से बाहर नहीं जाता।"></p>
    <div class="row">
      <button class="btn primary" id="runAll" data-en="Run all demo checks" data-hi="सभी डेमो जाँच चलाएँ"></button>
      <button class="btn warn" id="resetAll" data-en="Reset" data-hi="रीसेट"></button>
    </div>
    <div class="stat"><div><b id="nHigh">0</b><span data-en="open high alerts" data-hi="खुले गंभीर अलर्ट"></span></div><div><b id="nAll">0</b><span data-en="open alerts" data-hi="खुले अलर्ट"></span></div></div>
  </div>
  <div class="card"><h2 data-en="Latest alerts" data-hi="ताज़ा अलर्ट"></h2><div class="list" id="latest"></div></div>
  <div class="note" data-en="This web version runs every check inside your browser on sample or pasted data. The Linux version scans real folders and the real login log in the background, and also reviews app (APK) files." data-hi="यह वेब संस्करण हर जाँच आपके ब्राउज़र में नमूना या चिपकाए डेटा पर चलाता है। Linux संस्करण असली फ़ोल्डर और असली लॉगिन लॉग को बैकग्राउंड में जाँचता है और ऐप (APK) फ़ाइलें भी देखता है।"></div>
</section>

<!-- MESSAGES -->
<section class="panel" id="p-messages" hidden>
  <div class="card">
    <h2 data-en="Check a message, payment request or link" data-hi="संदेश, भुगतान अनुरोध या लिंक जाँचें"></h2>
    <p class="small muted" data-en="Paste the text of an SMS or WhatsApp message. It is analysed on your phone and not stored." data-hi="SMS या WhatsApp संदेश का टेक्स्ट चिपकाएँ। विश्लेषण आपके फ़ोन पर होता है और सेव नहीं होता।"></p>
    <label class="fld" for="msg" data-en="Message or link" data-hi="संदेश या लिंक"></label>
    <textarea id="msg" maxlength="5000" placeholder="Paste here"></textarea>
    <div class="row">
      <button class="btn primary" id="msgGo" data-en="Analyse" data-hi="जाँचें"></button>
      <button class="btn" id="msgScam" data-en="Sample scam" data-hi="नमूना ठगी"></button>
      <button class="btn" id="msgOk" data-en="Sample genuine" data-hi="नमूना असली"></button>
    </div>
    <div id="msgOut"></div>
  </div>
</section>

<!-- QR & PAYMENTS -->
<section class="panel" id="p-qr" hidden>
  <div class="card">
    <h2 data-en="1. Your real QR" data-hi="1. आपका असली QR"></h2>
    <label class="fld" for="qUpi" data-en="UPI ID" data-hi="UPI ID"></label>
    <input type="text" id="qUpi" autocapitalize="none" autocomplete="off" spellcheck="false">
    <label class="fld" for="qName" data-en="Payee name shown in your payment app" data-hi="आपके पेमेंट ऐप में दिखने वाला नाम"></label>
    <input type="text" id="qName" autocomplete="off">
    <div class="row"><button class="btn" id="qSave" data-en="Save" data-hi="सेव करें"></button></div>
  </div>
  <div class="card">
    <h2 data-en="2. Scan a QR to compare" data-hi="2. तुलना के लिए QR स्कैन करें"></h2>
    <p class="small muted" data-en="Take a photo of the QR (opens your camera) or choose a screenshot. Reading happens on your phone." data-hi="QR की फ़ोटो लें (कैमरा खुलेगा) या स्क्रीनशॉट चुनें। पढ़ना आपके फ़ोन पर होता है।"></p>
    <input type="file" id="qFile" accept="image/*" capture="environment" aria-label="QR photo">
    <label class="fld" for="qText" data-en="…or paste the QR text" data-hi="…या QR का टेक्स्ट चिपकाएँ"></label>
    <textarea id="qText" class="mono" style="min-height:64px" placeholder="upi://pay?pa=…"></textarea>
    <div class="row"><button class="btn primary" id="qCheck" data-en="Compare" data-hi="तुलना करें"></button></div>
    <h3 data-en="Try a sample QR" data-hi="नमूना QR आज़माएँ"></h3>
    <div class="row" style="margin-top:0">
      <button class="btn sm" data-qs="genuine" data-en="Genuine" data-hi="असली"></button>
      <button class="btn sm" data-qs="swapped" data-en="Look-alike swap" data-hi="मिलता-जुलता बदला"></button>
      <button class="btn sm" data-qs="other" data-en="Different payee" data-hi="दूसरा पाने वाला"></button>
      <button class="btn sm" data-qs="short" data-en="Short link" data-hi="छोटा लिंक"></button>
      <button class="btn sm" data-qs="name" data-en="Name differs" data-hi="नाम अलग"></button>
    </div>
    <div id="qOut"></div>
  </div>
  <div class="card">
    <h2 data-en="3. Sales and statement" data-hi="3. बिक्री और स्टेटमेंट"></h2>
    <p class="small muted" data-en="Compares your recorded sales with a statement CSV (txn_id,timestamp,amount,status). The result only says what that file contains." data-hi="आपकी दर्ज बिक्री की तुलना स्टेटमेंट CSV (txn_id,timestamp,amount,status) से करता है। नतीजा सिर्फ़ यह बताता है कि उस फ़ाइल में क्या है।"></p>
    <div class="row"><button class="btn primary" id="loadDemo" data-en="Load demo sales + statement" data-hi="डेमो बिक्री + स्टेटमेंट लोड करें"></button><button class="btn" id="recon" data-en="Reconcile" data-hi="मिलान करें"></button></div>
    <label class="fld" for="csvFile" data-en="Or choose your own statement CSV" data-hi="या अपनी स्टेटमेंट CSV चुनें"></label>
    <input type="file" id="csvFile" accept=".csv,text/csv">
    <div id="salesOut"></div>
  </div>
  <div class="card">
    <h2 data-en="4. Customer shows a 'payment successful' screen" data-hi="4. ग्राहक 'भुगतान सफल' स्क्रीन दिखाता है"></h2>
    <label class="chk"><input type="checkbox" id="vApp"><span data-en="I see the credit inside MY payment app or bank SMS" data-hi="मैं अपने पेमेंट ऐप या बैंक SMS में क्रेडिट देख रहा/रही हूँ"></span></label>
    <label class="chk"><input type="checkbox" id="vAmt"><span data-en="Amount matches the sale" data-hi="राशि बिक्री से मेल खाती है"></span></label>
    <label class="chk"><input type="checkbox" id="vTxn"><span data-en="Transaction ID is visible in my app" data-hi="लेन-देन ID मेरे ऐप में दिखती है"></span></label>
    <label class="chk"><input type="checkbox" id="vShot"><span data-en="I only have the customer's screenshot" data-hi="मेरे पास सिर्फ़ ग्राहक का स्क्रीनशॉट है"></span></label>
    <div class="row"><button class="btn primary" id="vGo" data-en="Get status" data-hi="स्थिति देखें"></button></div>
    <div id="vOut"></div>
  </div>
</section>

<!-- CODE & LOGS -->
<section class="panel" id="p-linux" hidden>
  <div class="card">
    <h2 data-en="Code and data leak scan" data-hi="कोड और डेटा लीक स्कैन"></h2>
    <p class="small muted" data-en="Paste the contents of one file. Values are masked in every result. On Linux the full app scans whole folders." data-hi="किसी एक फ़ाइल की सामग्री चिपकाएँ। हर नतीजे में मान छिपे रहते हैं। Linux ऐप पूरे फ़ोल्डर स्कैन करता है।"></p>
    <label class="fld" for="fName" data-en="File name" data-hi="फ़ाइल का नाम"></label>
    <input type="text" id="fName" value="billing_app.py" autocapitalize="none" spellcheck="false">
    <label class="fld" for="fText" data-en="File contents" data-hi="फ़ाइल की सामग्री"></label>
    <textarea id="fText" class="mono" style="min-height:150px"></textarea>
    <div class="row">
      <button class="btn primary" id="scanGo" data-en="Scan" data-hi="स्कैन करें"></button>
      <button class="btn" id="scanPy" data-en="Sample .py" data-hi="नमूना .py"></button>
      <button class="btn" id="scanEnv" data-en="Sample .env" data-hi="नमूना .env"></button>
    </div>
    <div id="scanOut"></div>
  </div>
  <div class="card">
    <h2 data-en="Failed-login monitor" data-hi="असफल लॉगिन निगरानी"></h2>
    <p class="small muted" data-en="Paste lines from a Linux auth log, or generate made-up lines with the buttons. A single mistyped password is never treated as an attack." data-hi="Linux auth लॉग की पंक्तियाँ चिपकाएँ, या बटनों से बनावटी पंक्तियाँ बनाएँ। एक गलत पासवर्ड को हमला नहीं माना जाता।"></p>
    <textarea id="logText" class="mono" style="min-height:130px" placeholder="Nov 14 10:00:01 host sshd[1]: Failed password for admin from 203.0.113.45 port 40010 ssh2"></textarea>
    <div class="row">
      <button class="btn primary" id="logGo" data-en="Check log" data-hi="लॉग जाँचें"></button>
      <button class="btn sm" data-lg="brute" data-en="Repeated failures" data-hi="बार-बार विफलता"></button>
      <button class="btn sm" data-lg="spray" data-en="Many accounts" data-hi="कई खाते"></button>
      <button class="btn sm" data-lg="success_after" data-en="Success after failures" data-hi="विफलता के बाद सफल"></button>
      <button class="btn sm" data-lg="benign" data-en="One typo" data-hi="एक गलती"></button>
    </div>
    <div id="logOut"></div>
  </div>
</section>

<!-- FACTORY -->
<section class="panel" id="p-factory" hidden>
  <div class="card">
    <div class="banner" data-en="SIMULATED DATA. Alerts only. This can never control or stop a machine." data-hi="सिम्युलेटेड डेटा। केवल अलर्ट। यह किसी मशीन को नियंत्रित या बंद नहीं कर सकता।"></div>
    <h2 id="devName">Pump-01 (SIMULATED)</h2>
    <div class="row">
      <button class="btn" data-tick="normal" data-en="Normal reading" data-hi="सामान्य रीडिंग"></button>
      <button class="btn" data-tick="overheat" data-en="Overheating" data-hi="अधिक गर्मी"></button>
      <button class="btn" data-tick="vibration" data-en="Vibration" data-hi="कंपन"></button>
      <button class="btn" data-tick="heartbeat_loss" data-en="Goes silent" data-hi="शांत हो गया"></button>
    </div>

  if (kind === "brute") for (let i = 0; i < n; i++) out.push(L(at(i * 6), `Failed password for admin from 203.0.113.45 port ${40000 + i} ssh2`));
  else if (kind === "spray") ["root", "admin", "billing", "test", "pos"].forEach((u, i) => out.push(L(at(i * 8), `Failed password for invalid user ${u} from 198.51.100.77 port ${41000 + i} ssh2`)));
  else if (kind === "success_after") { for (let i = 0; i < n; i++) out.push(L(at(i * 5), `Failed password for shopkeeper from 203.0.113.99 port ${42000 + i} ssh2`)); out.push(L(at(n * 5 + 10), "Accepted password for shopkeeper from 203.0.113.99 port 42100 ssh2")); }
  else { out.push(L(at(0), "Failed password for shopkeeper from 192.0.2.10 port 43000 ssh2")); out.push(L(at(20), "Accepted password for shopkeeper from 192.0.2.10 port 43001 ssh2")); }
  return out;
}

const RANGES = {temp: [20, 85], vib: [0, 7], cur: [2, 15]}, WARN = {temp: 75, vib: 5.5, cur: 13}, HEARTBEAT_S = 30;
const rnd = (a, b) => a + Math.random() * (b - a), r1 = x => Math.round(x * 10) / 10, r2 = x => Math.round(x * 100) / 100;
function nextReading(prev, mode) {
  if (mode === "heartbeat_loss") return null;
  const t = prev ? prev.temp : 60;
  const temp = mode === "overheat" ? (t > 70 ? Math.min(t + rnd(10, 14), 110) : t + rnd(12, 16)) : 60 + rnd(-3, 3);
  return {ts: new Date(), temp: r1(temp), vib: r2(mode === "vibration" ? rnd(8.5, 11) : 3 + rnd(-0.6, 0.6)), cur: r2(9 + rnd(-0.8, 0.8))};
}
function evalIot(rs, now = new Date()) {
  if (!rs.length) return [];
  const last = rs[rs.length - 1], a = [], act = {action_en: "Operator inspection recommended. Alerts only. This prototype sends no control commands and cannot stop or change any machine.", action_hi: "ऑपरेटर द्वारा निरीक्षण की सलाह। यह प्रोटोटाइप केवल अलर्ट देता है, मशीन पर कोई नियंत्रण आदेश नहीं भेजता।"};
  const add = (rule, severity, en, hi, evidence) => a.push({rule, severity, en, hi, evidence, ...act});
  if (now - last.ts > HEARTBEAT_S * 1000) add("I04", "high", `No data from the pump for over ${HEARTBEAT_S} seconds (heartbeat missing).`, `पंप से ${HEARTBEAT_S} सेकंड से ज़्यादा समय से डेटा नहीं (हार्टबीट गायब)।`, `last seen ${pad(last.ts.getHours())}:${pad(last.ts.getMinutes())}:${pad(last.ts.getSeconds())}`);
  const lab = {temp: ["Temperature", "तापमान"], vib: ["Vibration", "कंपन"], cur: ["Current", "करंट"]};
  for (const k of Object.keys(RANGES)) {
    const v = last[k], [lo, hi] = RANGES[k];
    if (v > hi || v < lo) add("I01", "high", `${lab[k][0]} ${v} is outside the configured range ${lo}-${hi}.`, `${lab[k][1]} ${v} तय सीमा ${lo}-${hi} से बाहर है।`, `${k}=${v}`);
    else if (v >= WARN[k]) add("I01", "medium", `${lab[k][0]} ${v} is near the upper limit (${hi}).`, `${lab[k][1]} ${v} ऊपरी सीमा (${hi}) के पास है।`, `${k}=${v}`);
  }
  if (rs.length >= 2 && Math.abs(rs[rs.length - 1].temp - rs[rs.length - 2].temp) >= 15) add("I02", "medium", `Temperature changed by ${Math.abs(rs[rs.length - 1].temp - rs[rs.length - 2].temp).toFixed(1)} degrees in one step.`, "तापमान एक कदम में अचानक बदला।", "delta>=15");
  if (rs.length >= 3 && rs.slice(-3).every(x => x.temp > RANGES.temp[1])) add("I03", "high", "Temperature stayed above the limit for 3 consecutive readings.", "तापमान लगातार 3 रीडिंग तक सीमा से ऊपर रहा।", "3 consecutive");
  return a;
}

function showQr(payload) {

  if (r.status !== "MATCH") noteAlerts([addAlert("qr", r.status, lvl === "high" ? "high" : "medium", `QR check: ${r.status.replace(/_/g, " ")}`, `QR जाँच: ${r.status}`, `expected=${r.expected.join(",")} observed=${r.observed}`, "QR integrity check", r.en, r.hi)]);
  refresh();
}

function decodeImageFile(file) {
  return new Promise((resolve, reject) => {
    if (typeof jsQR !== "function") return reject(new Error("decoder"));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        for (const maxSide of [1000, 600, 1600]) {
          const sc = Math.min(1, maxSide / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
          const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const ctx = cv.getContext("2d", {willReadFrequently: true}); ctx.drawImage(img, 0, 0, w, h);
          const d = ctx.getImageData(0, 0, w, h), code = jsQR(d.data, w, h, {inversionAttempts: "attemptBoth"});
          if (code && code.data) { URL.revokeObjectURL(url); return resolve(code.data); }
        }
        URL.revokeObjectURL(url); resolve(null);
      } catch (e) { reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); }; img.src = url;
  });
}
$("#qFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (!/^image\//.test(f.type)) { toast(T("Please choose an image", "कृपया एक छवि चुनें")); return; }
  if (f.size > 8e6) { toast(T("Image too large (8 MB max)", "छवि बहुत बड़ी है (अधिकतम 8 MB)")); return; }
  try { const text = await decodeImageFile(f); if (text) { $("#qText").value = text; showQr(text); } else showQr(""); }
  catch (err) { $("#qOut").innerHTML = box("medium", esc(T("The QR reader could not load. Paste the QR text instead.", "QR रीडर लोड नहीं हुआ। QR का टेक्स्ट चिपकाएँ।"))); }

  S.qrScans = S.qrScans; toast(T("Demo sales and statement loaded", "डेमो बिक्री और स्टेटमेंट लोड हुए")); refresh();

function doRecon() {
  if (!S.txns) { $("#salesOut").innerHTML = box("medium", esc(T("Load the demo, or choose a statement CSV first.", "पहले डेमो लोड करें, या स्टेटमेंट CSV चुनें।"))); return; }
  if (!S.sales.length) { $("#salesOut").innerHTML = box("medium", esc(T("No sales recorded. Load the demo sales.", "कोई बिक्री दर्ज नहीं। डेमो बिक्री लोड करें।"))); return; }
  const res = reconcile(S.sales, S.txns.rows), bad = res.summary.UNMATCHED + res.summary.AMBIGUOUS;
  S.recon = {bad, res}; supersede("payments");
  for (const r of res.rows) {
    if (r.status === "UNMATCHED") noteAlerts([addAlert("payments", "P01", "high", `Possible missing payment: Rs ${r.amount.toFixed(2)} at ${fmt(r.ts)}`, `संभावित गुम भुगतान: Rs ${r.amount.toFixed(2)}, ${fmt(r.ts)}`, `sale#${r.saleId} not in statement`, "Imported statement", r.en, r.hi)]);
    else if (r.status === "AMBIGUOUS") addAlert("payments", "P02", "medium", `Ambiguous match for Rs ${r.amount.toFixed(2)}`, `Rs ${r.amount.toFixed(2)} का मिलान अस्पष्ट`, `sale#${r.saleId} candidates=${r.candidates.join(",")}`, "Imported statement", r.en, r.hi);
  }
  refresh();
}
function renderSales() {
  const out = $("#salesOut"); if (!S.sales.length && !S.recon) { if (!out.innerHTML) out.innerHTML = ""; return; }
  if (!S.recon) { out.innerHTML = `<p class="small muted">${S.sales.length} ${T("sales and", "बिक्री और")} ${S.txns ? S.txns.rows.length : 0} ${T("statement rows loaded. Tap Reconcile.", "स्टेटमेंट पंक्तियाँ लोड हुईं। 'मिलान करें' दबाएँ।")}${S.demoRejected ? ` ${S.demoRejected} ${T("malformed row rejected.", "गलत पंक्ति अस्वीकृत।")}` : ""}</p>`; return; }
  const s = S.recon.res.summary;
  out.innerHTML = `<p class="small muted">${T("Source: imported statement", "स्रोत: आयात की गई स्टेटमेंट")} · ${T("refunds", "रिफंड")}: ${s.refunds.length} · ${T("duplicates ignored", "डुप्लिकेट अनदेखे")}: ${s.duplicates.length}</p><div class="list">` +
    S.recon.res.rows.map(r => `<div class="item ${r.status === "MATCHED" ? "low" : r.status === "UNMATCHED" ? "high" : "medium"}"><div>${pill(r.status, r.status === "MATCHED" ? "low" : r.status === "UNMATCHED" ? "high" : "medium")} <b>Rs ${r.amount.toFixed(2)}</b> <span class="meta">${esc(hhmm(r.ts))}${r.txn ? " · " + esc(r.txn) : ""}</span></div><div class="small">${esc(T(r.en, r.hi))}</div></div>`).join("") + "</div>";
}

/* --- factory --- */
function tick(mode) {
  const prev = S.tele[S.tele.length - 1], r = nextReading(prev, mode);
  if (r) { S.tele.push(r); if (S.tele.length > 30) S.tele.shift(); S.silent = false; }
  else { S.silent = true; if (!S.tele.length) { toast(T("Send a normal reading first", "पहले सामान्य रीडिंग भेजें")); return; } }
  const now = r ? new Date() : new Date(S.tele[S.tele.length - 1].ts.getTime() + (HEARTBEAT_S + 5) * 1000);
  for (const a of evalIot(S.tele, now)) noteAlerts([addAlert("factory", a.rule, a.severity, a.en, a.hi, `${a.evidence} ${pad(S.tele[S.tele.length - 1].ts.getHours())}:${pad(S.tele[S.tele.length - 1].ts.getMinutes())}:${pad(S.tele[S.tele.length - 1].ts.getSeconds())}`, "Factory simulator (SIMULATED data)", a.action_en, a.action_hi)]);
  refresh();
}
function renderIot() {
  const svg = $("#chart"), rs = S.tele, W = 640, H = 220, pd = 34;
  const y = v => H - pd - (H - 2 * pd) * (v - 20) / 90, x = i => pd + (W - 2 * pd) * (rs.length > 1 ? i / (rs.length - 1) : 0.5);
  const css = n => `var(${n})`;
  let g = `<line x1="${pd}" x2="${W - pd}" y1="${y(85)}" y2="${y(85)}" stroke="${css("--hi")}" stroke-dasharray="6 5"/><text x="${W - pd}" y="${y(85) - 6}" text-anchor="end" font-size="12" fill="${css("--hi")}">85 °C limit</text>`;
  [20, 60, 100].forEach(v => { g += `<text x="${pd - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${css("--mut")}">${v}</text>`; });
  if (!rs.length) g += `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="14" fill="${css("--mut")}">${esc(T("No readings yet. Tap Normal reading.", "अभी रीडिंग नहीं। 'सामान्य रीडिंग' दबाएँ।"))}</text>`;
  else g += `<polyline fill="none" stroke="${css("--accent")}" stroke-width="2.5" points="${rs.map((r, i) => `${x(i).toFixed(1)},${y(Math.min(r.temp, 110)).toFixed(1)}`).join(" ")}"/>` + rs.map((r, i) => `<circle cx="${x(i)}" cy="${y(Math.min(r.temp, 110))}" r="3.5" fill="${r.temp > 85 ? css("--hi") : css("--accent")}"/>`).join("");
  svg.innerHTML = g;
  if (!rs.length) { $("#iotOut").innerHTML = ""; return; }
  const last = rs[rs.length - 1], now = S.silent ? new Date(last.ts.getTime() + (HEARTBEAT_S + 5) * 1000) : new Date(), al = evalIot(rs, now);
  $("#devName").textContent = `Pump-01 (SIMULATED) · ${T("last seen", "अंतिम बार")} ${pad(last.ts.getHours())}:${pad(last.ts.getMinutes())}:${pad(last.ts.getSeconds())}`;
  $("#iotOut").innerHTML = `<p class="small muted">${T("Temperature", "तापमान")} ${last.temp} °C · ${T("vibration", "कंपन")} ${last.vib} mm/s · ${T("current", "करंट")} ${last.cur} A</p>` +
    (al.map(a => box(a.severity, `${pill(a.severity)} <b>${esc(a.rule)}</b> ${esc(T(a.en, a.hi))}<div class="small" style="margin-top:4px">${esc(T(a.action_en, a.action_hi))}</div>`)).join("") || `<p class="muted">${T("Within configured range.", "तय सीमा के भीतर।")}</p>`);
}
